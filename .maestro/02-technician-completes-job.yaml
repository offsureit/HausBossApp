# Technician completes a job end-to-end: Accept → On My Way → At Job Site → Clock In → Complete.
# Fixture: a pending job "Maestro Fixture" assigned to the technician, scheduled today (fixtures/reset.sql).
appId: app.hausboss.mobile
tags: [technician]
env:
  EMAIL: ${TECH_EMAIL}
  PASSWORD: ${TECH_PASSWORD}
---
- runFlow: shared/login.yaml
# The tab opens on a tall gradient header: wait for the screen, then scroll the target into view.
- extendedWaitUntil:
    visible:
      text: "Next up"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Maestro Fixture"
    direction: DOWN
    centerElement: true
    timeout: 30000
# Work from the job hub so every action targets exactly this job (Today lists other jobs too).
- tapOn: "Maestro Fixture"
- extendedWaitUntil:
    visible:
      text: "Pending"
    timeout: 15000
- tapOn: "Accept"
- extendedWaitUntil:
    visible:
      text: "Accepted"
    timeout: 30000
- tapOn: "On My Way"
# First time: the explainer sheet; the OS permission is already granted (launchApp permissions).
- runFlow:
    when:
      visible: "Share your location on jobs"
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible:
      text: "Confirm — I'm on my way"
    timeout: 30000
- tapOn: "Confirm — I'm on my way"
- extendedWaitUntil:
    visible:
      text: "At Job Site"
    timeout: 30000
# Location sharing shows in Today's gradient header: check it, then return to the job.
- back
- scrollUntilVisible:
    element:
      text: "Sharing location|Location only while open.*"
    direction: UP
    timeout: 15000
- takeScreenshot: maestro-02-en-route
- scrollUntilVisible:
    element:
      text: "Maestro Fixture"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Maestro Fixture"
- extendedWaitUntil:
    visible:
      text: "At Job Site"
    timeout: 15000
- tapOn: "At Job Site"
- extendedWaitUntil:
    visible:
      text: "Clock In"
    timeout: 30000
- tapOn: "Clock In"
- extendedWaitUntil:
    visible:
      text: "Pre-Job photo"
    timeout: 30000
# Let the sheet finish sliding up so the tap does not land on Cancel below Skip.
- waitForAnimationToEnd
- tapOn: "Skip"
- extendedWaitUntil:
    visible:
      text: "Complete"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "In Progress"
    timeout: 15000
- takeScreenshot: maestro-02-in-progress
- tapOn: "Complete"
- extendedWaitUntil:
    visible:
      text: "Post-Job photo"
    timeout: 30000
# Let the sheet finish sliding up so the tap does not land on Cancel below Skip.
- waitForAnimationToEnd
- tapOn: "Skip"
- extendedWaitUntil:
    visible:
      text: "Completion notes"
    timeout: 30000
- tapOn:
    id: "notes-input"
- inputText: "Replaced the thermostat, tested heating."
# No hideKeyboard: on Android it presses Back, which closes the sheet. The button sits above the keyboard.
- tapOn: "Complete job"
- extendedWaitUntil:
    visible:
      text: "Completed"
    timeout: 20000
# Confetti, then the job moves to the Completed section of Today.
- back
- scrollUntilVisible:
    element:
      text: "Open job for Maestro Fixture, completed"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: maestro-02-completed
