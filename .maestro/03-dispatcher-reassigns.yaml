# Dispatcher reassigns a job from the employee sheet (Dashboard → employee roster → Reassign).
# Fixture: three pending jobs for the technician; "Maestro Reassign" (the second) goes to the manager (fixtures/reset.sql).
appId: app.hausboss.mobile
tags: [dispatcher]
env:
  EMAIL: ${OWNER_EMAIL}
  PASSWORD: ${OWNER_PASSWORD}
---
- runFlow: shared/login.yaml
- extendedWaitUntil:
    visible:
      text: "Calendar"
    timeout: 20000
# Staff tabs: Dashboard instead of Today.
- assertVisible: "Dashboard"
- tapOn: "Dashboard"
# The dashboard opens on a tall gradient header: wait for it, then scroll the roster into view.
- extendedWaitUntil:
    visible:
      text: "Live map"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Employees"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "${TECH_NAME}.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "${TECH_NAME}.*"
- extendedWaitUntil:
    visible:
      text: "Open jobs.*"
    timeout: 10000
# Each open job's Reassign button is labelled with the customer ("Reassign Maestro Reassign").
- scrollUntilVisible:
    element:
      text: "Reassign Maestro Reassign"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: maestro-03-employee-sheet
- tapOn: "Reassign Maestro Reassign"
- extendedWaitUntil:
    visible:
      text: "Reassign job"
    timeout: 10000
- tapOn:
    text: "Assign to.*"
- tapOn:
    text: "${MANAGER_NAME} \\(Manager\\)"
- extendedWaitUntil:
    visible:
      text: "Assign to: ${MANAGER_NAME}.*"
    timeout: 5000
- tapOn:
    text: "Reassign"
    index: 0
# The sheet closes on success ("Reassigned to …" toast) and the roster counts move:
# the technician loses one open job. run.sh then checks the server row points at the manager.
# The roster is above the job list the page was scrolled to.
# The roster row updates live (the exact count depends on the other demo jobs; run.sh checks the server row).
- scrollUntilVisible:
    element:
      text: "${TECH_NAME}: \\d+ open jobs?"
    direction: DOWN
    timeout: 15000
- takeScreenshot: maestro-03-reassigned
